name: binferno_env
channels:
  - pytorch
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - bedtools=2.31.1
  - biolib=0.1.9
  - hmmer=3.4
  - prodigal=2.6.3
  - samtools=1.5
  - fraggenescan=1.32
  - python=3.10.13
  - python-dateutil=2.9.0post0
  - scipy=1.15.3
  - pip:
    - checkm-genome==1.1.3
    - biopython==1.79
    - binferno==0.1.0 # make sure to update this and specify a gpu-compatible version if needed
    - click==8.0

