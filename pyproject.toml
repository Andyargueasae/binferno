[project]
name = "binferno"
version = "0.1.0"
description = "Metagenomic binner using SimCLR and Barlow Twins training, with taxonomic embeddings by Corgi to improve microbial genome binning."

authors = [
    {name = "Andy Tong", email = "tyuhao037@gmail.com"},
    {name = "Robert Turnbull", email = "rbturnbull@unimelb.edu.au"}
]

keywords = [
    "metagenomics",
    "binning",
    "neural networks",
    "contrastive learning",
    "bioinformatics",
]

license = {text = "GPL-3.0"}
readme = "README.rst"

requires-python = ">=3.10,<3.13"

dependencies = [
    "atomicwrites (>=1.4.1,<2.0.0)",
    "checkm-genome (>=1.1.3,<=1.2.4)",
    "pyfastx==2.3.0",
    "setuptools (>=79.0.0,<81.0)",
    "pysam (>=0.20,<=0.23)",
    "biopython>=1.80",
    "matplotlib (>=3.10.7,<4.0.0)",
    "matplotlib-inline (>=0.2.1,<0.3.0)",
    "numpy (>=1.6.0,<3.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "scipy (>=1.15.0,<2.0.0)",
    "tensorboard (>=2.20.0,<3.0.0)",
    "click (>=8.3.1,<9.0.0)",
    "hnswlib (>=0.8.0,<0.9.0)",
    "igraph (>=1.0.0,<2.0.0)",
    "leidenalg (>=0.11.0,<0.12.0)",
    "networkx==3.4.0",
    "numba (>=0.62.1,<0.63.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "torch (>=2.5.1, <=2.6.0)",
    "bio-corgi (>=0.5.1,<0.6.0)",
    "tyro (>=1.0.13,<2.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "pyrodigal (>=3.6.3,<=3.7.1)",
    "pyhmmer (>=0.10.15,<=0.12.0)",
    "loguru (>=0.7.3,<0.8.0)",
]

# external dependencies from conda (install separately):
# - fraggenescan: Required for gene prediction in core gene analysis
# - HMMER3 v3.4: Required for core gene analysis and taxonomic embedding generation

[project.optional-dependencies]
# Pin the SDK API used by the local ESM-C 300M/600M inference adapter.
esmc = ["esm>=3.2.1,<3.3"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = ">=25.11.0" # formatting scripts.
pytest = ">=9.0.1" # testing framework. pytest-cov is used for coverage reporting.
coverage = ">=7.12.0" # coverage - the reporting of pytests. 
Sphinx = ">=5.0.0"
sphinx-rtd-theme = ">=1.0.0"
sphinx-autobuild = ">=2021.3.14"
sphinx-copybutton = ">=0.4.0"

[tool.poetry.scripts]
binferno = "binferno.main:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q -ra --strict-markers --strict-config"
markers = [
  "long: long-running tests (run with --long)"
]
filterwarnings = [
  "ignore::DeprecationWarning",
]