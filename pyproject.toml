[project]
name = "binferno"
version = "0.1.0"
description = "Metagenomic binning"
authors = [
    {name = "Andy Tong"}
]
license = {text = "GPL-3.0"}
readme = "README.rst"
requires-python = ">=3.11,<3.13"
dependencies = [
    "atomicwrites (>=1.4.1,<2.0.0)",
    "biolib (>=0.1.9,<0.2.0)",
    "biopython (>=1.86,<2.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "matplotlib-inline (>=0.2.1,<0.3.0)",
    "numpy (>=1.6.0,<3.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "fastjsonschema (>=2.21.2,<3.0.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "tensorboard (>=2.20.0,<3.0.0)",
    "click (>=8.3.1,<9.0.0)",
    "hnswlib (>=0.8.0,<0.9.0)",
    "igraph (>=1.0.0,<2.0.0)",
    "joblib (>=1.5.2,<2.0.0)",
    "leidenalg (>=0.11.0,<0.12.0)",
    "networkx (>=3.5,<4.0)",
    "numba (>=0.62.1,<0.63.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "scanpy (>=1.11.5,<2.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "statsmodels (>=0.14.5,<0.15.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "bio-corgi (>=0.5.1,<0.6.0)",
    "tyro (>=1.0.13,<2.0.0)",
    "pydantic (>=2.13.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = ">=25.11.0"
pytest = ">=9.0.1"
coverage = ">=7.12.0"

[tool.poetry.scripts]
binferno = "binferno.main:main"
