name: Conda packaging

on:
  push:
    paths:
      - 'recipe/**'
      - 'scripts/check_conda_packaging.py'
      - 'pyproject.toml'
      - 'environment.yml'
      - '.github/workflows/conda.yml'
  pull_request:
    paths:
      - 'recipe/**'
      - 'scripts/check_conda_packaging.py'
      - 'pyproject.toml'
      - 'environment.yml'
      - '.github/workflows/conda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONDA_BLD_PATH: ${{ github.workspace }}/conda-bld
      CONDA_OVERRIDE_CUDA: '0'
    steps:
      - name: Free build disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build distributions and check recipe parity
        run: |
          python -m pip install build 'poetry-core>=2,<3' jinja2 pyyaml packaging
          python -m build --no-isolation
          python scripts/check_conda_packaging.py dist/*.whl
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: conda-build-tools
          python-version: '3.11'
          channels: conda-forge,bioconda
          channel-priority: strict
      - name: Install conda build tools
        shell: bash -el {0}
        run: conda install -y -n conda-build-tools --override-channels -c conda-forge conda-build
      - name: Render publication recipe
        shell: bash -el {0}
        run: |
          conda run -n conda-build-tools python -c "from conda_build import api; metadata = api.render('recipe', finalize=False); assert metadata; print(api.output_yaml(metadata[0][0]))"
      - name: Full conda build and installed package smoke tests
        shell: bash -el {0}
        run: |
          conda run -n conda-build-tools python -c "from conda_build import api; api.build('recipe', anaconda_upload=False, channel_urls=['conda-forge', 'bioconda'], override_channels=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: binferno-python-distributions
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: binferno-conda-package
          path: conda-bld/noarch/binferno-*
          if-no-files-found: error
