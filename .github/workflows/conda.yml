name: Conda packaging

on:
  push:
    paths:
      - 'recipe/**'
      - 'scripts/check_conda_packaging.py'
      - 'pyproject.toml'
      - 'environment.yml'
      - '.github/workflows/conda.yml'
  pull_request:
    paths:
      - 'recipe/**'
      - 'scripts/check_conda_packaging.py'
      - 'pyproject.toml'
      - 'environment.yml'
      - '.github/workflows/conda.yml'
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Build and test (requires bio-corgi and its dependencies in configured channels)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build distributions and check recipe parity
        run: |
          python -m pip install build 'poetry-core>=2,<3' jinja2 pyyaml packaging
          python -m build --no-isolation
          python scripts/check_conda_packaging.py dist/*.whl
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: conda-build-tools
          python-version: '3.11'
          channels: conda-forge,bioconda
          channel-priority: strict
      - name: Install conda build tools
        shell: bash -el {0}
        run: conda install -y --override-channels -c conda-forge conda-build
      - name: Render recipe without solving unavailable dependencies
        shell: bash -el {0}
        run: conda render recipe --no-finalize
      - name: Full conda build and installed package smoke tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
        shell: bash -el {0}
        run: conda build recipe --override-channels -c conda-forge -c bioconda
      - uses: actions/upload-artifact@v4
        with:
          name: binferno-python-distributions
          path: dist/*
